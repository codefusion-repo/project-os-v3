name: Local Bridge bootstrap

on:
  pull_request:
    paths:
      - 'local-bridge/**'
      - '.github/workflows/local-bridge-ci.yml'
  push:
    branches: [main]
    paths:
      - 'local-bridge/**'
      - '.github/workflows/local-bridge-ci.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c local-bridge/requirements-linux-py312.txt ./local-bridge
      - run: python -m pip check
      - run: python -m pip list --format=freeze
      - run: python -m unittest discover -s local-bridge/tests -v
      - run: project-os-bridge --help
      - run: project-os-bridge-http --help
      - run: project-os-bridge-fixture --help
      - run: project-os-bridge-init --help
