name: Selector and structure

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run stdlib tests
        run: python3 -m unittest discover -s tests -v
      - name: Test optional enhanced terminal
        run: |
          python3 -m venv /tmp/project-os-ci-venv
          /tmp/project-os-ci-venv/bin/python -m pip install 'prompt_toolkit==3.0.53'
          /tmp/project-os-ci-venv/bin/python -m unittest discover -s tests -v

  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Diagnose setup-python interpreter against the production trust policy
        run: |
          python3 -I -B - <<'PY'
          import importlib.util, os, stat, sys
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("upgrade", Path("local-bridge/scripts/upgrade.py"))
          upgrade = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(upgrade)
          executable = Path(sys.executable)
          for parent in (executable.resolve().parent, *executable.resolve().parent.parents):
              info = parent.lstat()
              print("CI_TOOLCACHE_PARENT", parent, "mode=" + oct(stat.S_IMODE(info.st_mode)),
                    "trusted_owner=" + str(info.st_uid in (0, os.getuid())))
          try:
              identity = upgrade.host_interpreter_identity()
          except PermissionError as exc:
              if str(exc) not in ("Unsafe host interpreter parent", "Untrusted interpreter owner", "Unsafe interpreter executable"):
                  raise
              print("CI_TOOLCACHE_TRUST_REJECTED:", str(exc))
          else:
              print("CI_TOOLCACHE_TRUST_PASS", "interpreter_sha256=" + identity["sha256"])
          PY
      - name: Run installer and negative controls in disposable checkout
        # Ubuntu 24.04 supplies system Python 3.12; no toolcache override or
        # permission changes. The public coordinator enforces the same policy.
        run: env -u LD_LIBRARY_PATH -u PYTHONHOME -u PYTHONPATH PATH=/usr/bin:/bin /bin/bash local-bridge/scripts/ci-install.sh
      - name: Verify real Android QA signing and exact delivery input
        env:
          PYTHONPATH: local-bridge/tests
        run: |
          # Fresh disposable GitHub-hosted VM only, never the PM host.
          test ! -e /opt/project-os-qa-ci && test ! -L /opt/project-os-qa-ci
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" /opt/project-os-qa-ci
          local-bridge/.venv/bin/python local-bridge/scripts/ci-android-qa-signing.py
      - name: Record verified wheel receipt for maintenance preflight
        id: wheel-receipt
        run: |
          python3 -I -B - <<'PY'
          import json, os, re
          from pathlib import Path
          receipt = json.loads(Path("local-bridge/.venv/.project-os-bridge-install.json").read_text())
          assert set(receipt) == {"sha", "wheel_sha256"}
          assert receipt["sha"] == os.environ["GITHUB_SHA"]
          assert re.fullmatch(r"[0-9a-f]{64}", receipt["wheel_sha256"])
          attempt = os.environ["GITHUB_RUN_ATTEMPT"]
          assert re.fullmatch(r"[1-9][0-9]*", attempt)
          name = "maintenance-wheel-" + attempt + "-" + receipt["wheel_sha256"]
          Path(os.environ["RUNNER_TEMP"], "maintenance-wheel-receipt.json").write_text(json.dumps(receipt) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("name=" + name + "\n")
          PY
      - name: Preserve verified wheel receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.wheel-receipt.outputs.name }}
          path: ${{ runner.temp }}/maintenance-wheel-receipt.json
          if-no-files-found: error
          retention-days: 90

  mobile-profile-smoke:
    # CI-only trusted synthetic projects; not an approved local execution image.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        stack: [flutter, expo]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked Bridge imports for disposable job orchestration
        run: |
          python3 -m venv "$RUNNER_TEMP/mobile-bridge"
          "$RUNNER_TEMP/mobile-bridge/bin/python" -m pip install --require-hashes --only-binary=:all: -r local-bridge/requirements-linux-py312.lock
      - name: Require rootless Podman and OCI conversion tools
        run: |
          command -v podman
          if ! command -v skopeo >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends skopeo
          fi
          podman --version
          skopeo --version
      - name: Materialize synthetic revision and execute registered profile commands through rootless Podman
        env:
          MOBILE_STACK: ${{ matrix.stack }}
          PYTHONPATH: local-bridge/src:local-bridge/tests
        run: '"$RUNNER_TEMP/mobile-bridge/bin/python" local-bridge/scripts/ci-mobile-smoke.py'
      - name: Preserve mobile smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mobile-smoke-${{ matrix.stack }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mobile-smoke-evidence/
          if-no-files-found: error
          retention-days: 90

  mobile-apk-smoke:
    # Both reference APKs use the same CI-only job contract; no emulator or local runtime.
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        stack: [flutter, expo]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked Bridge imports
        run: |
          python3 -m venv "$RUNNER_TEMP/mobile-bridge"
          "$RUNNER_TEMP/mobile-bridge/bin/python" -m pip install --require-hashes --only-binary=:all: -r local-bridge/requirements-linux-py312.lock
      - name: Require rootless Podman and OCI conversion tools
        run: |
          command -v podman
          if ! command -v skopeo >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends skopeo
          fi
          podman --version
          skopeo --version
      - name: Build synthetic debug APK through authenticated durable Podman job offline
        env:
          MOBILE_STACK: ${{ matrix.stack }}
          MOBILE_APK: '1'
          PYTHONPATH: local-bridge/src:local-bridge/tests
        run: '"$RUNNER_TEMP/mobile-bridge/bin/python" local-bridge/scripts/ci-mobile-smoke.py'
      - name: Preserve APK and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mobile-apk-${{ matrix.stack }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mobile-smoke-evidence/
          if-no-files-found: error
          retention-days: 90

  dependency-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact runtime closure and audit with locked tooling
        run: bash local-bridge/scripts/ci-dependency-evidence.sh runtime

  build-backend-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify backend wheel, offline build and locked audit
        run: bash local-bridge/scripts/ci-dependency-evidence.sh build

  oci-audit:
    # Retain the legacy check name; it cannot pass unless both candidate replicas pass.
    needs: [alpine-fixture-only]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test original rejection evaluator
        run: python3 -m unittest discover -s local-bridge/scripts -p test_oci_original_control.py -v
      - name: Prove exact rejection of original public fixture without executing it
        run: bash local-bridge/scripts/ci-oci-original-control.sh
      - name: Preserve original scanner report and exit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: original-oci-rejection-evidence
          path: ${{ runner.temp }}/lb-original-oci-evidence/
          if-no-files-found: error
          retention-days: 90
      - name: Require both fixture-only replicas even for legacy check
        if: always()
        env:
          CANDIDATE: ${{ needs.alpine-fixture-only.result }}
        run: test "$CANDIDATE" = success

  oci-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test official manifest resolver and audit summaries
        run: python3 -m unittest discover -s local-bridge/scripts -p test_oci_compare.py -v
      - name: Compare official Python variants by platform digest (evidence only)
        run: python3 local-bridge/scripts/oci_compare.py

  alpine-remediation:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and audit disposable Alpine candidate
        run: bash local-bridge/scripts/ci-alpine-remediate.sh
      - name: Preserve public OCI scanner evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alpine-baseline-${{ matrix.replica }}-evidence
          path: ${{ runner.temp }}/lb-oci-evidence/
          if-no-files-found: error
          retention-days: 90

  alpine-residual:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Evaluate residual security fixes in disposable runner
        run: bash local-bridge/scripts/ci-alpine-remediate.sh residual
      - name: Preserve public OCI scanner evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alpine-residual-${{ matrix.replica }}-evidence
          path: ${{ runner.temp }}/lb-oci-evidence/
          if-no-files-found: error
          retention-days: 90

  alpine-fixture-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Evaluate minimal fixture-only candidate in disposable runner
        run: bash local-bridge/scripts/ci-alpine-remediate.sh fixture-only
      - name: Preserve public OCI scanner evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alpine-fixture-only-${{ matrix.replica }}-evidence
          path: ${{ runner.temp }}/lb-oci-evidence/
          if-no-files-found: error
          retention-days: 90

  oci-acceptance:
    # PM-approved CI-only stdlib fixture; no local binding or general execution.
    needs: [alpine-fixture-only, alpine-residual, oci-audit]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require both candidate replicas and both negative controls
        env:
          CANDIDATE: ${{ needs.alpine-fixture-only.result }}
          RESIDUAL: ${{ needs.alpine-residual.result }}
          ORIGINAL: ${{ needs.oci-audit.result }}
        run: |
          set -eu
          test "$CANDIDATE" = success
          test "$RESIDUAL" = success
          test "$ORIGINAL" = success
          echo 'OCI_ACCEPTANCE_PASS scope=ci-fixed-stdlib-fixture sha256:0c8e915d597f997fc64b7ddfc8e25de93873d06126faccbee1f46446deb30cfb'
