name: Selector and structure

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run stdlib tests
        run: python3 -m unittest discover -s tests -v
      - name: Test optional enhanced terminal
        run: |
          python3 -m venv /tmp/project-os-ci-venv
          /tmp/project-os-ci-venv/bin/python -m pip install 'prompt_toolkit==3.0.53'
          /tmp/project-os-ci-venv/bin/python -m unittest discover -s tests -v

  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run installer and negative controls in disposable checkout
        run: bash local-bridge/scripts/ci-install.sh

  dependency-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact runtime wheels
        run: |
          python -m pip --isolated download --index-url https://pypi.org/simple --only-binary=:all: --require-hashes --no-deps -r local-bridge/requirements-linux-py312.lock -d "$RUNNER_TEMP/bridge-wheels"
          python local-bridge/scripts/lock_wheels.py local-bridge/requirements-linux-py312.txt "$RUNNER_TEMP/bridge-wheels" > "$RUNNER_TEMP/bridge-candidate.lock"
          diff -u <(grep -v "^#" local-bridge/requirements-linux-py312.lock) "$RUNNER_TEMP/bridge-candidate.lock"
      - name: Verify wheel hashes and dependency closure in fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/bridge-clean"
          "$RUNNER_TEMP/bridge-clean/bin/python" -m pip --isolated install --no-index --find-links "$RUNNER_TEMP/bridge-wheels" --only-binary=:all: --require-hashes -r "$RUNNER_TEMP/bridge-candidate.lock"
          "$RUNNER_TEMP/bridge-clean/bin/python" -m pip check
      - name: Audit exact runtime versions using separate tooling
        run: |
          python -m venv "$RUNNER_TEMP/bridge-audit"
          "$RUNNER_TEMP/bridge-audit/bin/python" -m pip --isolated install --index-url https://pypi.org/simple pip-audit==2.10.1
          "$RUNNER_TEMP/bridge-audit/bin/python" -m pip_audit --version
          "$RUNNER_TEMP/bridge-audit/bin/python" -m pip_audit --require-hashes --no-deps --strict -r local-bridge/requirements-linux-py312.lock

  build-backend-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify committed backend wheel and build offline
        run: |
          python -m pip --isolated download --index-url https://pypi.org/simple --only-binary=:all: --require-hashes --no-deps -r local-bridge/requirements-build.lock -d "$RUNNER_TEMP/build-wheels"
          python -m venv "$RUNNER_TEMP/build-clean"
          "$RUNNER_TEMP/build-clean/bin/python" -m pip --isolated install --no-index --find-links "$RUNNER_TEMP/build-wheels" --require-hashes -r local-bridge/requirements-build.lock
          "$RUNNER_TEMP/build-clean/bin/python" -m pip --isolated wheel --no-index --no-build-isolation --no-deps ./local-bridge -w "$RUNNER_TEMP/project-wheel"
      - name: Audit build backend
        run: |
          python -m venv "$RUNNER_TEMP/build-audit"
          "$RUNNER_TEMP/build-audit/bin/python" -m pip --isolated install --index-url https://pypi.org/simple pip-audit==2.10.1
          "$RUNNER_TEMP/build-audit/bin/python" -m pip_audit --require-hashes --no-deps --strict -r local-bridge/requirements-build.lock

  powershell-wrapper:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test wrapper argument forwarding and failure propagation
        shell: pwsh
        run: ./local-bridge/tests/test_install_wrapper.ps1

  oci-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Audit pinned public fixture without running it
        run: bash local-bridge/scripts/ci-oci-audit.sh

  oci-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test official manifest resolver and audit summaries
        run: python3 -m unittest discover -s local-bridge/scripts -p test_oci_compare.py -v
      - name: Compare official Python variants by platform digest (evidence only)
        run: python3 local-bridge/scripts/oci_compare.py
