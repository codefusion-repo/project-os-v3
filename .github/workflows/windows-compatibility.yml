name: Windows compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell-wrapper:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test wrapper argument forwarding and failure propagation
        shell: pwsh
        run: ./local-bridge/tests/test_install_wrapper.ps1
      - name: Test real Windows WSL2 installer with disposable Git fixture
        shell: pwsh
        run: ./local-bridge/tests/test_install_wsl.ps1
