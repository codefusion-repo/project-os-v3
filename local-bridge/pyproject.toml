[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-os-local-bridge"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["mcp==2.3.0"]

[project.scripts]
project-os-bridge = "project_os_bridge.server:main"

[tool.setuptools.packages.find]
where = ["src"]
