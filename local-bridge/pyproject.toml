[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "project-os-local-bridge"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["mcp==2.3.0", "PyJWT[crypto]==2.15.1", "httpx==0.28.1"]

[project.scripts]
project-os-bridge = "project_os_bridge.server:main"
project-os-bridge-http = "project_os_bridge.authenticated:main"
project-os-bridge-fixture = "project_os_bridge.vertical:main"
project-os-bridge-init = "project_os_bridge.setup_instance:main"

[tool.setuptools.packages.find]
where = ["src"]
